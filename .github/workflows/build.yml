{
  "name": "Build APK",
  "on": {
    "push": { "branches": ["main"] },
    "workflow_dispatch": {}
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-java@v4", "with": { "distribution": "temurin", "java-version": 17 } },
        { "uses": "gradle/actions/setup-gradle@v4", "with": { "gradle-version": "8.14.3" } },
        {
          "name": "Prepare signing key",
          "env": { "KEYSTORE_B64": "${{ secrets.KEYSTORE_B64 }}" },
          "run": "if [ -n \"$KEYSTORE_B64\" ]; then echo \"$KEYSTORE_B64\" | base64 -d > \"$RUNNER_TEMP/bp.jks\"; echo \"KEYSTORE_FILE=$RUNNER_TEMP/bp.jks\" >> \"$GITHUB_ENV\"; fi"
        },
        {
          "name": "Build",
          "env": { "KEYSTORE_PASSWORD": "${{ secrets.KEYSTORE_PASSWORD }}" },
          "run": "gradle assembleDebug --no-daemon"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": { "name": "BingPalette-apk", "path": "app/build/outputs/apk/debug/app-debug.apk" }
        }
      ]
    }
  }
}
